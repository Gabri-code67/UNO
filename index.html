<!doctype html><html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>UNO — Fatti vedere. €1.</title><style>
body{margin:0;font-family:system-ui;background:#f6f5f1;color:#151515}header{padding:18px 6%;display:flex;justify-content:space-between;background:#fff;border-bottom:1px solid #ddd;position:sticky;top:0}.logo{font-size:28px;font-weight:950}.wrap{max-width:1000px;margin:auto;padding:30px 18px}.hero{text-align:center;padding:55px 0}.hero h1{font-size:clamp(55px,11vw,100px);line-height:.9;letter-spacing:-6px;margin:0 0 20px}.hero p{color:#666;font-size:18px;max-width:600px;margin:0 auto 25px}.btn{border:0;border-radius:999px;padding:12px 18px;background:#151515;color:#fff;font-weight:800;cursor:pointer}.light{background:#fff;color:#151515;border:1px solid #ddd}.actions{display:flex;gap:9px;justify-content:center}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:14px}.card{background:#fff;border:1px solid #ddd;border-radius:20px;padding:19px}.tag{font-size:11px;color:#777;font-weight:900;text-transform:uppercase}.card h3{margin:9px 0}.card p{color:#555;line-height:1.5}.muted{color:#777}dialog{border:0;border-radius:22px;width:min(560px,90%);padding:0}dialog::backdrop{background:#0008}.modal{padding:24px}label{display:block;font-weight:800;font-size:13px;margin:12px 0 6px}input,textarea,select{width:100%;box-sizing:border-box;padding:11px;border:1px solid #ddd;border-radius:10px;font:inherit}textarea{min-height:100px}.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}.actions2{display:flex;justify-content:flex-end;gap:8px;margin-top:16px}@media(max-width:650px){.row{grid-template-columns:1fr}.actions{flex-wrap:wrap}}</style></head>
<body><header><b class="logo">UNO</b><div><button class="btn light" id="login">Accedi</button> <button class="btn" id="pub">Pubblica · €1</button></div></header>
<main class="wrap"><section class="hero"><h1>Fatti vedere.<br>€1.</h1><p>Persone, idee, passioni e progetti. Un piccolo spazio su Internet per raccontare ciò che fai.</p><div class="actions"><button class="btn" id="hero">Pubblica il tuo spazio — €1</button></div></section><h2>🔥 Chi si sta facendo vedere</h2><p class="muted">Gli annunci attivi della community.</p><div class="grid" id="ads">Caricamento…</div></main>
<dialog id="auth"><div class="modal"><h2 id="at">Accedi</h2><form id="af"><label>Email</label><input id="email" type="email" required><label>Password</label><input id="pass" type="password" minlength="6" required><div class="actions2"><button type="button" class="btn light" onclick="auth.close()">Chiudi</button><button class="btn">Continua</button></div></form><p class="muted" id="switch">Non hai un account? Registrati</p></div></dialog>
<dialog id="admodal"><div class="modal"><h2>Crea il tuo spazio</h2><p class="muted">L'annuncio viene salvato e poi paghi €1.</p><form id="adform"><label>Titolo</label><input id="title" maxlength="70" required><div class="row"><div><label>Categoria</label><select id="category"><option>Musica</option><option>Arte & creatività</option><option>Idee & progetti</option><option>Lavoro & competenze</option><option>Prodotti & attività</option><option>Cause & associazioni</option><option>Studio & cultura</option><option>Animali</option><option>Persone & community</option><option>Altro</option></select></div><div><label>Nome</label><input id="name" maxlength="60" required></div></div><label>Descrizione</label><textarea id="description" maxlength="500" required></textarea><div class="row"><div><label>Città</label><input id="city"></div><div><label>Link</label><input id="url" type="url" placeholder="https://..."></div></div><div class="actions2"><button type="button" class="btn light" onclick="admodal.close()">Annulla</button><button class="btn">Continua → €1</button></div></form></div></dialog>
<script src="config.js"></script><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>
const db=supabase.createClient(UNO_CONFIG.SUPABASE_URL,UNO_CONFIG.SUPABASE_PUBLISHABLE_KEY),auth=document.getElementById('auth'),admodal=document.getElementById('admodal');let mode='login';
async function load(){let{data,error}=await db.from('ads').select('*').eq('status','active').order('created_at',{ascending:false});document.getElementById('ads').innerHTML=error?'Errore nel caricamento.':data.length?data.map(a=>`<article class="card"><div class="tag">${esc(a.category)}${a.city?' · '+esc(a.city):''}</div><h3>${esc(a.title)}</h3><p>${esc(a.description)}</p><b>${esc(a.display_name)}</b><div class="muted">👁 ${a.views}</div>${a.external_url?`<p><a href="${esc(a.external_url)}" target="_blank">Scopri →</a></p>`:''}</article>`).join(''):'Ancora nessun annuncio. Sii il primo!'}
function esc(x){return String(x||'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]) )}
async function user(){let{data}=await db.auth.getUser();return data.user}
function openAd(){user().then(u=>u?admodal.showModal():auth.showModal())}
pub.onclick=hero.onclick=openAd;login.onclick=()=>auth.showModal();
switch.onclick=()=>{mode=mode==='login'?'signup':'login';at.textContent=mode==='login'?'Accedi':'Crea account';switch.textContent=mode==='login'?'Non hai un account? Registrati':'Hai già un account? Accedi'};
af.onsubmit=async e=>{e.preventDefault();let r=mode==='login'?await db.auth.signInWithPassword({email:email.value,password:pass.value}):await db.auth.signUp({email:email.value,password:pass.value});if(r.error)alert(r.error.message);else{auth.close();if(mode==='signup')alert('Account creato. Controlla la tua email se richiesto.');}};
adform.onsubmit=async e=>{e.preventDefault();let u=await user();if(!u){admodal.close();auth.showModal();return}let{data,error}=await db.from('ads').insert({user_id:u.id,title:title.value,category:category.value,description:description.value,display_name:name.value,city:city.value||null,external_url:url.value||null}).select('id').single();if(error)return alert(error.message);let r=await fetch('/api/create-checkout',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({adId:data.id,email:u.email})});let out=await r.json();if(!r.ok)return alert(out.error||'Errore pagamento');location.href=out.url};
load();
</script></body></html>
